    var p = document.body || document.documentElement;

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

      const s = document.createElement('script');

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.

        s.textContent = await r.text();
        s.removeAttribute('src');

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"662081a7-cdfd-4081-a1b4-452a64b0792c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\n  :root {\n    /* Brand */\n    --red: #FF0000;\n    --red-deep: #D60000;\n    --red-soft: #FFE5E5;\n    /* Ink (black + grays per brandbook) */\n    --ink: #000000;\n    --ink-2: #1A1A1A;\n    --ink-3: #404040;\n    --ink-4: #646464;\n    --ink-5: #9CA3AF;\n    /* Lines & surfaces */\n    --line: #E5E7EB;\n    --line-2: #F1F2F4;\n    --bg: #FFFFFF;\n    --bg-2: #F8FAFC;\n    --bg-3: #EEF1F5;\n    /* Semantic */\n    --green: #16A34A;\n    --amber: #F59E0B;\n    --blue: #2563EB;\n  }\n\n  body[data-theme=\"dark\"] {\n    --ink: #FFFFFF;\n    --ink-2: #E5E7EB;\n    --ink-3: #9CA3AF;\n    --ink-4: #646464;\n    --ink-5: #404040;\n    --line: #1F1F1F;\n    --line-2: #0F0F0F;\n    --bg: #000000;\n    --bg-2: #0A0A0A;\n    --bg-3: #141414;\n    --red-soft: #2A0F12;\n  }\n\n  * { box-sizing: border-box; }\n\n  html, body {\n    margin: 0;\n    padding: 0;\n    background: var(--bg);\n    color: var(--ink);\n    font-family: Inter, system-ui, -apple-system, sans-serif;\n    font-weight: 400;\n    font-size: 16px;\n    line-height: 1.5;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n  }\n\n  a { color: inherit; text-decoration: none; }\n  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }\n\n  .mono {\n    font-family: \"JetBrains Mono\", monospace;\n    font-feature-settings: \"tnum\";\n  }\n\n  .container {\n    max-width: 1320px;\n    margin: 0 auto;\n    padding: 0 32px;\n  }\n\n  /* ============= TICKER ============= */\n  .ticker {\n    background: var(--ink);\n    color: #fff;\n    overflow: hidden;\n    position: relative;\n    border-bottom: 1px solid var(--ink);\n    font-family: \"JetBrains Mono\", monospace;\n    font-size: 12px;\n    font-weight: 500;\n    letter-spacing: 0.02em;\n  }\n  .ticker-track {\n    display: flex;\n    gap: 56px;\n    padding: 9px 0;\n    white-space: nowrap;\n    animation: tickerScroll 60s linear infinite;\n    width: max-content;\n  }\n  .ticker-item { display: inline-flex; align-items: center; gap: 12px; }\n  .ticker-item .label { color: rgba(255,255,255,.55); }\n  .ticker-item .v { color: #fff; }\n  .ticker-item .delta-up { color: #4ADE80; }\n  .ticker-item .delta-dn { color: #FF6B6B; }\n  .ticker-item .dot {\n    width: 6px; height: 6px; border-radius: 50%;\n    background: var(--red);\n    animation: pulse 1.6s ease-in-out infinite;\n  }\n  @keyframes tickerScroll {\n    from { transform: translateX(0); }\n    to   { transform: translateX(-50%); }\n  }\n  @keyframes pulse {\n    0%, 100% { opacity: 1; transform: scale(1); }\n    50%      { opacity: 0.4; transform: scale(0.7); }\n  }\n\n  /* ============= NAV ============= */\n  nav.top {\n    position: sticky;\n    top: 0;\n    z-index: 50;\n    background: color-mix(in srgb, var(--bg) 92%, transparent);\n    backdrop-filter: saturate(180%) blur(14px);\n    -webkit-backdrop-filter: saturate(180%) blur(14px);\n    border-bottom: 1px solid var(--line);\n  }\n  nav.top .row {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 24px;\n    height: 64px;\n  }\n  .brand {\n    display: inline-flex;\n    align-items: center;\n    gap: 10px;\n    font-weight: 800;\n    font-size: 18px;\n    letter-spacing: -0.025em;\n    color: var(--ink);\n  }\n  .brand-mark {\n    width: 30px;\n    height: 30px;\n    flex-shrink: 0;\n  }\n  .brand-mark svg { width: 100%; height: 100%; display: block; }\n  .brand-mark .mark-light { display: block; }\n  .brand-mark .mark-dark { display: none; }\n  body[data-theme=\"dark\"] nav.top .brand-mark .mark-light { display: none; }\n  body[data-theme=\"dark\"] nav.top .brand-mark .mark-dark { display: block; }\n  .brand .voda { font-weight: 800; }\n  .brand .control { font-weight: 400; color: var(--ink-2); }\n  body[data-theme=\"dark\"] .brand .control { color: var(--ink-2); }\n\n  .nav-links {\n    display: flex;\n    gap: 28px;\n    font-size: 14px;\n    color: var(--ink-3);\n    font-weight: 500;\n    white-space: nowrap;\n  }\n  .nav-links a:hover { color: var(--ink); }\n  .nav-cta { display: flex; gap: 14px; align-items: center; flex-shrink: 0; }\n  .nav-cta a.login { font-size: 14px; color: var(--ink-3); font-weight: 500; }\n  .nav-cta a.login:hover { color: var(--ink); }\n\n  .btn {\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    padding: 10px 18px;\n    border-radius: 6px;\n    font-weight: 600;\n    font-size: 14px;\n    transition: background .15s ease, transform .15s ease;\n    white-space: nowrap;\n    letter-spacing: -0.005em;\n  }\n  .btn-primary {\n    background: var(--red);\n    color: #fff;\n  }\n  .btn-primary:hover { background: var(--red-deep); }\n  /* Secondary per brandbook: white bg + red border + red text */\n  .btn-ghost {\n    color: var(--red);\n    border: 1.5px solid var(--red);\n    background: var(--bg);\n  }\n  .btn-ghost:hover { background: var(--red-soft); }\n  body[data-theme=\"dark\"] .btn-ghost { background: transparent; }\n  body[data-theme=\"dark\"] .btn-ghost:hover { background: rgba(255,0,0,.12); }\n  .btn-lg { padding: 14px 22px; font-size: 15px; }\n\n  /* ============= HERO ============= */\n  .hero {\n    border-bottom: 1px solid var(--line);\n    padding: 64px 0 0;\n    overflow: hidden;\n  }\n  .hero-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 0;\n    align-items: end;\n  }\n  .hero-meta {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    font-family: \"JetBrains Mono\", monospace;\n    font-size: 11.5px;\n    color: var(--ink-4);\n    letter-spacing: 0.04em;\n    text-transform: uppercase;\n    margin-botto nes <span class=\"red\">no<\u002Fspan> me ha pagado Vodafone?<\u002Fh3>\n        <div class=\"a\">\n          Cada producto de tus ofertas frente a lo que paga Callidus y a la tabla de comisiones vigente en su fecha de activación. <b>Descuadre, Exceso de comisión o Sin liquidar<\u002Fb>, con los totales de lo que filtres.\n          <span class=\"meta\"><span class=\"dot\"><\u002Fspan>Vista: Conciliaciones / Ofertas y comisiones<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"question-row\">\n        <div class=\"num\">Q.04<\u002Fdiv>\n        <h3 class=\"q\">¿Cuánto va a llegar el día 25?<\u002Fh3>\n        <div class=\"a\">\n          En qué <b>ciclo de pago<\u002Fb> cobrarás cada activación y si la prima que paga Vodafone cuadra al céntimo con tus ofertas. Lo que falta pasa a <b>Reclamaciones<\u002Fb> con un clic y sigues su estado hasta el cierre.\n          <span class=\"meta\"><span class=\"dot\"><\u002Fspan>Vista: Primas / Reclamaciones<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"question-row\">\n        <div class=\"num\">Q.05<\u002Fdiv>\n        <h3 class=\"q\">¿Qué oportunidades se están <span class=\"red\">perdiendo<\u002Fspan>?<\u002Fh3>\n        <div class=\"a\">\n          El Funnel reparte el valor del trimestre en tres patas contra el objetivo y <b>pondera lo no firmado por su probabilidad de cierre<\u002Fb>. Por estado de oportunidad y de oferta, por comercial y por equipo.\n          <span class=\"meta\"><span class=\"dot\"><\u002Fspan>Vista: Dashboard / Funnel<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"question-row\">\n        <div class=\"num\">Q.06<\u002Fdiv>\n        <h3 class=\"q\">¿Está mi comercial <span class=\"red\">dando seguimiento<\u002Fspan> al cliente?<\u002Fh3>\n        <div class=\"a\">\n          Agenda de visitas y llamadas con participantes, recordatorios y cita en Outlook. El dashboard de actividades te dice <b>qué parte de la cartera se ha trabajado en el trimestre<\u002Fb>.\n          <span class=\"meta\"><span class=\"dot\"><\u002Fspan>Vista: Agenda / Dashboard de actividades<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"question-row\">\n        <div class=\"num\">Q.07<\u002Fdiv>\n        <h3 class=\"q\">¿Cuánto tengo que pagar a <span class=\"red\">mis comerciales<\u002Fspan>?<\u002Fh3>\n        <div class=\"a\">\n          Configuras lo que pagas a tu red —captación y fidelización—, con bolsa, objetivos y pesos por mes. <b>Cada uno ve lo que cobra, con su desglose.<\u002Fb>\n          <span class=\"meta\"><span class=\"dot\"><\u002Fspan>Vista: Comisiones comerciales<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"question-row\">\n        <div class=\"num\">Q.08<\u002Fdiv>\n        <h3 class=\"q\">¿Dónde está cada <span class=\"red\">terminal<\u002Fspan>?<\u002Fh3>\n        <div class=\"a\">\n          Recompra y venta de terminales, <b>stock por almacén<\u002Fb> con traspasos entre zonas, entrada desde la oferta y salida por IMEI, al precio vigente en cada fecha.\n          <span class=\"meta\"><span class=\"dot\"><\u002Fspan>Vista: Terminales / Stock<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============= CHART SECTION ============= -->\n<section class=\"chart-section\" id=\"dashboard\">\n  <div class=\"container\">\n    <div class=\"chart-grid\">\n      <div>\n        <div class=\"section-meta\">02 · DASHBOARD EJECUTIVO<\u002Fdiv>\n        <h2 class=\"section-title\" style=\"font-size: clamp(34px, 4vw, 56px);\">Una pantalla. <br>Toda la <span style=\"color:var(--red);\">operación.<\u002Fspan><\u002Fh2>\n        <p class=\"section-lede\" style=\"margin-bottom: 32px;\">Lo que vende cada comercial, qué oportunidades se escapan, cuánto llevas de cada prima y qué te debe Vodafone. <b>Al día, sin un equipo dedicado a mirarlo.<\u002Fb><\u002Fp>\n\n        <ul style=\"list-style:none; p >04 · CRM Y AGENDA<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1.15fr; gap: 80px; align-items: center;\">\n      <div>\n        <h2 class=\"section-title\" style=\"font-size: clamp(34px, 4vw, 56px);\">Toda la actividad comercial, <br><span style=\"color:var(--red);\">en un solo sitio.<\u002Fspan><\u002Fh2>\n        <p class=\"section-lede\">Cuentas, oportunidades, ofertas, visitas y llamadas, conectadas entre sí. Cada nota y cada cambio queda registrado. <b>Sabes en qué está cada oportunidad sin tener que preguntarlo.<\u002Fb><\u002Fp>\n\n        <ul style=\"list-style:none; padding:0; margin:32px 0 0; display:grid; gap:18px;\">\n          <li style=\"display:grid; grid-template-columns: 28px 1fr; gap: 16px; align-items: start;\">\n            <span class=\"mono\" style=\"font-size:11px; font-weight:700; color:var(--red); letter-spacing:.06em;\">↳<\u002Fspan>\n            <span style=\"color:var(--ink-2); font-size:15.5px; line-height:1.5;\"><b>Agenda del equipo<\u002Fb> — visitas y llamadas con participantes y menciones, recordatorios y cita en Outlook o tu calendario, que se mueve sola si cambia la fecha.<\u002Fspan>\n          <\u002Fli>\n          <li style=\"display:grid; grid-template-columns: 28px 1fr; gap: 16px; align-items: start;\">\n            <span class=\"mono\" style=\"font-size:11px; font-weight:700; color:var(--red); letter-spacing:.06em;\">↳<\u002Fspan>\n            <span style=\"color:var(--ink-2); font-size:15.5px; line-height:1.5;\"><b>Del NMC a la oportunidad, solo<\u002Fb> — las ofertas y SA de Vodagest entran cada tarde en su oportunidad, con su responsable.<\u002Fspan>\n          <\u002Fli>\n          <li style=\"display:grid; grid-template-columns: 28px 1fr; gap: 16px; align-items: start;\">\n            <span class=\"mono\" style=\"font-size:11px; font-weight:700; color:var(--red); letter-spacing:.06em;\">↳<\u002Fspan>\n            <span style=\"color:var(--ink-2); font-size:15.5px; line-height:1.5;\"><b>La cartera es tuya, no del comercial<\u002Fb> — todo el histórico de cada cliente queda en tu sistema. Si un comercial se va, la información se queda.<\u002Fspan>\n          <\u002Fli>\n          <li style=\"display:grid; grid-template-columns: 28px 1fr; gap: 16px; align-items: start;\">\n            <span class=\"mono\" style=\"font-size:11px; font-weight:700; color:var(--red); letter-spacing:.06em;\">↳<\u002Fspan>\n            <span style=\"color:var(--ink-2); font-size:15.5px; line-height:1.5;\"><b>Historial completo<\u002Fb> — cada cambio de la oferta, campo a campo, y quién lo hizo.<\u002Fspan>\n          <\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <!-- CRM mock -->\n      <div class=\"app-shot\"><div class=\"bar\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv><span class=\"tag\">Vista de la app<\u002Fspan><img src=\"brand/screens/app-agenda.png\" alt=\"Agenda de actividades comerciales en VodaControl\" width=\"1700\" height=\"1060\" loading=\"lazy\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============= DATOS DE VODAFONE ============= -->\n<section class=\"feat-section\" id=\"vodafone\">\n  <div class=\"container\">\n    <div class=\"section-meta\">05 · DATOS DE VODAFONE, SIN TECLEAR<\u002Fdiv>\n    <h2 class=\"section-title\">Lo que Vodafone te manda,<br><span style=\"color:var(--red);\">ya cargado.<\u002Fspan><\u002Fh2>\n    <p class=\"section-lede\">VodaControl trabaja con los portales y ficheros que ya usas. Sin copiar ni pegar, sin hojas de cálculo intermedias.<\u002Fp>\n\n    <div class=\"feat-group\">\n      <div class=\"mono\">Fuentes de Vodafone<\u002Fdiv>\n      <div class=\"feat-grid\">\n        <div class=\"feat-card\"><div class=\"k\">NMC · Vodagest<\u002Fdiv><h4>Ofertas y SA, sin teclear<\u002Fh4><p>Las ofertas nuevas entran solas cada tarde, con los datos de contrato y la configuración. También subes el fichero desde la propia oferta.<\u002Fp><\u002Fdiv>\n        <div class=\"feat-card\"><div class=\"k\">Callidus<\u002Fdiv><h4>Activaciones y pagos<\u002Fh4><p>Cada carga de activaciones y comisiones se concilia sola contra tus ofertas, y del pago llegas a la oferta en un clic.<\u002Fp><\u002Fdiv>\n        <div class=\"feat-card\"><div class=\"k\">Captación<\u002Fdiv><h4>El Excel semanal, cruzado<\u002Fh4><p>Sube el Excel de Captación de Vodafone, crúzalo con la app y asigna los MSISDN en bloque.<\u002Fp><\u002Fdiv>\n        <div class=\"feat-card\"><div class=\"k\">Fidelización<\u002Fdiv><h4>Bajas y cualificación<\u002Fh4><p>Importa el Excel de Fidelización: tasa de bajas, GIN y cualificación de cada cuenta.<\u002Fp><\u002Fdiv>\n        <div class=\"feat-card\"><div class=\"k\">Tabla de comisiones<\u002Fdiv><h4>Siempre la vigente<\u002Fh4><p>Cada producto calcula con la tabla de su fecha: merma, cuota anual, apoyos y equivalencias producto a producto.<\u002Fp><\u002Fdiv>\n        <div class=\"feat-card\"><div class=\"k\">SIM<\u002Fdiv><h4>Inventario de SIM<\u002Fh4><p>El ICC, el PIN y el PUK de cada línea, a mano cuando el cliente lo pide.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"feat-group\">\n      <div class=\"mono\">Y el resto de tu operación<\u002Fdiv>\n      <div class=\"feat-grid\">\n        <div class=\"feat-card\"><div class=\"k\">Comisiones de tu red<\u002Fdiv><h4>Lo que pagas, calculado<\u002Fh4><p>Perfiles de captación y fidelización, con bolsa, objetivos y pesos por mes. Cada comercial ve su desglose.<\u002Fp><\u002Fdiv>\n        <div class=\"feat-card\"><div class=\"k\">Terminales<\u002Fdiv><h4>Recompra y stock<\u002Fh4><p>Compra y venta de terminales, stock por almacén, traspasos entre zonas y salida por IMEI.<\u002Fp><\u002Fdiv>\n        <div class=\"feat-card\"><div class=\"k\">Oferta comercial<\u002Fdiv><h4>Tu oferta, a tu manera<\u002Fh4><p>La oferta separa lo que paga el cliente de tu rentabilidad, con tu propia presentación.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============= MARQUEE ============= -->\n<section class=\"marquee-section\" style=\"padding: 28px 0;\">\n  <div class=\"marquee-track\">\n    <span>INFORMACIÓN<\u002Fspan>\n    <span class=\"dot\"><\u002Fspan>\n    <span>CONTROL<\u002Fspan>\n    <span class=\"dot\"><\u002Fspan>\n    <span>CRECIMIENTO<\u002Fspan>\n    <span class=\"dot\"><\u002Fspan>\n    <span>INFORMACIÓN<\u002Fspan>\n    <span class=\"dot\"><\u002Fspan>\n    <span>CONTROL<\u002Fspan>\n    <span class=\"dot\"><\u002Fspan>\n    <span>CRECIMIENTO<\u002Fspan>\n    <span class=\"dot\"><\u002Fspan>\n    <span>INFORMACIÓN<\u002Fspan>\n    <span class=\"dot\"><\u002Fspan>\n    <span>CONTROL<\u002Fspan>\n    <span class=\"dot\"><\u002Fspan>\n    <span>CRECIMIENTO<\u002Fspan>\n    <span class=\"dot\"><\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============= HOW IT WORKS ============= -->\n<section class=\"how-section\" id=\"como-funciona\">\n  <div class=\"container\">\n    <div class=\"section-meta\">06 · CÓMO FUNCIONA<\u002Fdiv>\n    <h2 class=\"section-title\">De ficheros sueltos<br>a <span style=\"color:var(--red);\">decisiones<\u002Fspan> en ≈15 días.<\u002Fh2>\n    <p class=\"section-lede\">Onboarding guiado por un equipo que conoce el negocio. Sin proyectos eternos, sin consultoras. Operativo en cuanto tengamos toda la información.<\u002Fp>\n\n    <div class=\"how-grid\">\n      <div>\n        <div class=\"step\">\n          <span class=\"n\">PASO 01<\u002Fspan>\n          <div>\n            <h4>Conectamos tus fuentes<\u002Fh4>\n            <p>Callidus, NMC y Vodagest, Excel de Captación y de Fidelización, e importamos tu histórico de ofertas, cuentas y oportunidades.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"step\">\n          <span class=\"n\">PASO 02<\u002Fspan>\n          <div>\n            <h4>Modelamos tu operación<\u002Fh4>\n            <p>Productos, comerciales, zonas, comisiones y objetivos — replicamos cómo funciona realmente tu distribución, no un modelo genérico.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"step\">\n          <span class=\"n\">PASO 03<\u002Fspan>\n          <div>\n            <h4>Validamos un mes histórico<\u002Fh4>\n            <p>Cruzamos el último mes con Callidus para enseñarte exactamente cuánto te dejaste sin reclamar — antes de que firmes nada más.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"step\">\n          <span class=\"n\">PASO 04<\u002Fspan>\n          <div>\n            <h4>Tu equipo opera<\u002Fh4>\n            <p>Formación a dirección, ventas y back-office, manual del comercial y guías dentro de la app. Soporte en español, y cada novedad anunciada en Ayuda › Novedades.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============= FAQ ============= -->\n<section class=\"faq-section\" id=\"faq\">\n  <div class=\"container\">\n    <div class=\"faq-grid\" style=\"margin-top: 0; align-items: start;\">\n      <div>\n        <div class=\"section-meta\">07 · DUDAS HABITUALES<\u002Fdiv>\n        <h2 class=\"section-title\" style=\"font-size: clamp(34px, 4vw, 52px);\">Lo que <span style=\"color:var(--red);\">siempre<\u002Fspan> nos preguntan.<\u002Fh2>\n        <p class=\"section-lede\">Si hay algo más, una llamada de 15 minutos resuelve el resto.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"faq-list\">\n        <details open=\"\">\n          <summary><span class=\"n\">01<\u002Fspan><span>¿VodaControl es un producto oficial de Vodafone?<\u002Fspan><\u002Fsummary>\n          <p>No. VodaControl es un producto independiente de <b>Fenixia Solutions S.L.<\u002Fb>, diseñado específicamente para distribuidores de Vodafone Empresas. Trabajamos con el formato oficial de los ficheros de liquidación, pero no somos parte de Vodafone España S.A.U.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary><span class=\"n\">02<\u002Fspan><span>¿Qué tengo que conectar? ¿Necesito otro CRM?<\u002Fspan><\u002Fsummary>\n          <p>No necesitas otro CRM: VodaControl ya lo incluye. Trabajamos con lo que te da Vodafone —<b>Callidus, NMC y Vodagest, SA del Configurador, Excel de Captación y de Fidelización<\u002Fb>— y tu histórico de cuentas y ofertas se importa desde Excel.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary><span class=\"n\">03<\u002Fspan><span>¿Cuánto se tarda en estar operativo?<\u002Fspan><\u002Fsummary>\n          <p>Una vez obtenida toda la información necesaria, en aproximadamente 15 días estás operativo. Conectamos tus datos, validamos un mes histórico contra Callidus y entregamos la operación a tu equipo con formación incluida.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary><span class=\"n\">04<\u002Fspan><span>¿Qué tipo de discrepancias detectáis?<\u002Fspan><\u002Fsummary>\n          <p>Producto a producto, frente a la tabla de comisiones vigente en su fecha de activación: <b>Descuadre<\u002Fb> (Vodafone paga de menos), <b>Exceso de comisión<\u002Fb> (paga de más o por algo que no devenga), <b>Sin liquidar<\u002Fb> (activado y sin pago) y <b>Pendiente de activación<\u002Fb>. En las primas, el resumen de pago de Vodafone frente a lo que sale de tus ofertas.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary><span class=\"n\">05<\u002Fspan><span>¿Cuánto cuesta?<\u002Fspan><\u002Fsummary>\n          <p>Fee mensual fijo según la cantidad de usuarios y el volumen de actividad. Está diseñado para que lo que recuperas en discrepancias cubra de sobra el fee.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary><span class=\"n\">06<\u002Fspan><span>¿Mis datos están seguros?<\u002Fspan><\u002Fsummary>\n          <p>Cada distribuidor trabaja aislado del resto. Conexión cifrada, <b>verificación en dos pasos<\u002Fb>, permisos por rol y equipo, auditoría de accesos y de cada cambio, RGPD y copias de segu
